services:
  api:
    build:
      context: .
      target: development
    command: npm run server
    environment:
      API_HOST: 0.0.0.0
      # MySQL connection; read from the untracked .env next to compose.yaml (see docs/mysql-development.md).
      DB_HOST: ${DB_HOST:-side-project-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_SSL_MODE: ${DB_SSL_MODE:-disabled}
      DB_SSL_CA_BASE64: ${DB_SSL_CA_BASE64:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_REGION: ${R2_REGION:-auto}
      # Optional; read from an untracked .env file next to compose.yaml.
      DISCORD_WEBHOOK_LEAVE: ${DISCORD_WEBHOOK_LEAVE:-}
      DISCORD_WEBHOOK_MEMBER: ${DISCORD_WEBHOOK_MEMBER:-}
    networks: [default, side-project]
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      - ./server:/app/server
      - ./src/domain:/app/src/domain
      - guild_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    init: true
  frontend:
    build:
      context: .
      target: development
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    depends_on:
      api:
        condition: service_healthy
    init: true
volumes:
  guild_data:

networks:
  side-project:
    external: true
    name: side-project-environment
